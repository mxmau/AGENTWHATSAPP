services:
  - type: web
    name: whatsapp-agent-monitor
    runtime: docker
    plan: free
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: GROUP_ESCOLA_1
        value: Ecilda Ramos 2026
      - key: GROUP_ESCOLA_2
        value: Professores - Tiradentes
      - key: GROUP_IGREJA
        value: Ministro e Obreiros IIGD BV
      - key: CONTACT_ESPOSA
        value: Rafaelly
      - key: CONTACT_PASTOR
        value: PR Josehilton
      - key: CONTACT_EU
        value: ""
      - key: HOURS_LOOKBACK
        value: "12"
      - key: LOG_MESSAGE_PREVIEW_LIMIT
        value: "10"
      - key: PORT
        value: "3001"
